name: Full Automated Secure Build & Licensing

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-and-protect:
    runs-on: ubuntu-latest

    steps:
      # 1. تنزيل الكود مع الفروع الفرعية
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. إعداد بيئة جافا وبايثون أولاً وتثبيت المكتبات
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install cryptography Pillow

      # 3. استرجاع مكتبة Dobby الأصلية النظيفة
      - name: Restore Clean Official Dobby Submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force
          git submodule foreach --recursive git reset --hard
          git submodule foreach --recursive git clean -fdx
          echo "Dobby official source restored cleanly."

      # 4. استبدال سيرفرات علي بابا بمستودعات Google و Maven الرسمية
      - name: Replace Aliyun Mirrors with Official Repositories
        run: |
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/repository/public|https://repo1.maven.org/maven2|g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/repository/jcenter|https://repo1.maven.org/maven2|g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/[^'\''"]*|https://repo1.maven.org/maven2|g' {} +
          echo "Official repositories configured."

      # 5. معالجة وتوليد أيقونة وشعار التطبيق RiyadhRiders بدون تكرار
      - name: Process App Icon and Logo
        run: |
          cat << 'EOF' > process_icon.py
          import os, glob, shutil
          from PIL import Image

          # 1. حذف جميع الأيقونات القديمة لتفادي خطأ Duplicate resources
          for old_icon in glob.glob('app/src/main/res/mipmap*/*launcher*'):
              try:
                  os.remove(old_icon)
              except Exception:
                  pass

          # حذف مجلد أيقونات anydpi القديمة لضمان تطبيق الشعار الجديد على أندرويد الحديث
          if os.path.exists('app/src/main/res/mipmap-anydpi-v26'):
              shutil.rmtree('app/src/main/res/mipmap-anydpi-v26', ignore_errors=True)

          # 2. البحث عن صورة الشعار المرفوعة
          candidates = ['8.jpg', 'icon.png', 'icon.jpg', 'logo.png', 'logo.jpg']
          found_img = None
          for c in candidates:
              if os.path.exists(c):
                  found_img = c
                  break

          if not found_img:
              for f in os.listdir('.'):
                  if f.lower().endswith(('.png', '.jpg', '.jpeg')) and not f.startswith('.'):
                      found_img = f
                      break

          if found_img:
              print(f"Processing app icon from: {found_img}")
              im = Image.open(found_img).convert('RGBA')

              # حفظ الشعار بدقة عالية في drawable لاستخدامه داخل واجهة التفعيل
              os.makedirs('app/src/main/res/drawable', exist_ok=True)
              im.resize((512, 512), Image.Resampling.LANCZOS).save('app/src/main/res/drawable/app_logo.png')

              # توليد مقاسات الأيقونات الرسمية بصيغة PNG حصراً
              densities = {
                  'mipmap-mdpi': 48,
                  'mipmap-hdpi': 72,
                  'mipmap-xhdpi': 96,
                  'mipmap-xxhdpi': 144,
                  'mipmap-xxxhdpi': 192
              }
              for folder, size in densities.items():
                  p = os.path.join('app/src/main/res', folder)
                  os.makedirs(p, exist_ok=True)
                  resized = im.resize((size, size), Image.Resampling.LANCZOS)
                  resized.save(os.path.join(p, 'ic_launcher.png'))
                  resized.save(os.path.join(p, 'ic_launcher_round.png'))
              print("Clean icons and logos generated successfully with zero duplicates.")
          else:
              print("Notice: No custom image found in root.")
          EOF
          python3 process_icon.py

      # 6. تغيير اسم التطبيق إلى RiyadhRiders وحزمة الـ Package Name إلى riyadh.rider.selfi
      - name: Apply App Name and Package Name (riyadh.rider.selfi)
        run: |
          cat << 'EOF' > apply_naming.py
          import os, re

          # 1. تحديث applicationId في build.gradle
          if os.path.exists('app/build.gradle'):
              with open('app/build.gradle', 'r') as f:
                  bg = f.read()
              bg = re.sub(r"applicationId\s+['\"][^'\"]+['\"]", 'applicationId "riyadh.rider.selfi"', bg)
              with open('app/build.gradle', 'w') as f:
                  f.write(bg)
              print("Application ID updated to riyadh.rider.selfi")

          # 2. تحديث اسم التطبيق في AndroidManifest.xml
          manifest_path = 'app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  mf = f.read()
              mf = re.sub(r'android:label="[^"]*"', 'android:label="RiyadhRiders"', mf)
              with open(manifest_path, 'w') as f:
                  f.write(mf)
              print("App Label updated to RiyadhRiders in AndroidManifest.xml")

          # 3. تحديث اسم التطبيق في strings.xml
          for root, dirs, files in os.walk('app/src/main/res'):
              if 'strings.xml' in files:
                  sp = os.path.join(root, 'strings.xml')
                  with open(sp, 'r') as f:
                      st = f.read()
                  st = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">RiyadhRiders</string>', st)
                  with open(sp, 'w') as f:
                      f.write(st)

          # 4. تحديث scope.list الخاص بـ Xposed
          scope_path = 'app/src/main/resources/META-INF/xposed/scope.list'
          if os.path.exists(scope_path):
              with open(scope_path, 'w') as f:
                  f.write('riyadh.rider.selfi\n')
          EOF
          python3 apply_naming.py

      # 7. توليد مفاتيح التشفير RSA-2048
      - name: Generate Cryptographic Keys
        run: |
          mkdir -p keys_output
          cat << 'EOF' > gen_keys.py
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization

          priv = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          with open('keys_output/private_key.pem', 'wb') as f:
              f.write(priv.private_bytes(
                  encoding=serialization.Encoding.PEM,
                  format=serialization.PrivateFormat.PKCS8,
                  encryption_algorithm=serialization.NoEncryption()
              ))

          pub = priv.public_key()
          pub_pem = pub.public_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PublicFormat.SubjectPublicKeyInfo
          )
          with open('keys_output/public_key.pem', 'wb') as f:
              f.write(pub_pem)

          clean_pub = ''.join([l for l in pub_pem.decode('utf-8').splitlines() if not l.startswith('-----')])
          with open('keys_output/public_key_clean.txt', 'w') as f:
              f.write(clean_pub)
          EOF
          python3 gen_keys.py
          echo "PUB_KEY=$(cat keys_output/public_key_clean.txt)" >> $GITHUB_ENV

      # 8. حقن نظام الترخيص وشاشة التفعيل مع زر واتساب وشعار التطبيق
      - name: Inject LicenseManager & RiyadhRiders Activation UI
        run: |
          cat << 'EOF' > inject_ui.py
          import os, re

          pub_key = os.environ.get('PUB_KEY', '')
          target_dir = 'app/src/main/java/io/github/zensu357/camswap'
          pkg = 'io.github.zensu357.camswap'

          if not os.path.exists(target_dir):
              for root, dirs, files in os.walk('app/src/main/java'):
                  if files:
                      target_dir = root
                      pkg = root.replace('app/src/main/java/', '').replace('/', '.')
                      break

          os.makedirs(target_dir, exist_ok=True)
          old_kt = os.path.join(target_dir, 'LicenseManager.kt')
          if os.path.exists(old_kt):
              os.remove(old_kt)

          # 1. كود LicenseManager.java
          license_manager_code = f'''package {pkg};

          import android.content.Context;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;
          import android.util.Base64;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.File;
          import java.io.FileReader;
          import java.io.FileWriter;
          import java.security.KeyFactory;
          import java.security.MessageDigest;
          import java.security.PublicKey;
          import java.security.Signature;
          import java.security.spec.X509EncodedKeySpec;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.TimeZone;

          public class LicenseManager {{
              public static final String PUBLIC_KEY_BASE64 = "{pub_key}";

              public static class LicenseInfo {{
                  public boolean isValid;
                  public String owner = "";
                  public String hwid = "";
                  public String expiresAt = "";
                  public String tier = "";
                  public String errorMessage = null;

                  public LicenseInfo(boolean isValid) {{
                      this.isValid = isValid;
                  }}

                  public LicenseInfo(boolean isValid, String errorMessage) {{
                      this.isValid = isValid;
                      this.errorMessage = errorMessage;
                  }}

                  public LicenseInfo(boolean isValid, String owner, String hwid, String expiresAt, String tier) {{
                      this.isValid = isValid;
                      this.owner = owner;
                      this.hwid = hwid;
                      this.expiresAt = expiresAt;
                      this.tier = tier;
                  }}
              }}

              public static String getDeviceHWID(Context context) {{
                  try {{
                      String androidId = "";
                      if (context != null) {{
                          androidId = Settings.Secure.getString(context.getContentResolver(), Settings.Secure.ANDROID_ID);
                      }}
                      if (androidId == null) androidId = "";
                      String raw = androidId + Build.BOARD + Build.BRAND + Build.DEVICE + Build.HARDWARE + Build.MANUFACTURER + Build.MODEL;
                      MessageDigest digest = MessageDigest.getInstance("SHA-256");
                      byte[] hash = digest.digest(raw.getBytes("UTF-8"));
                      StringBuilder hexString = new StringBuilder();
                      for (byte b : hash) {{
                          String hex = Integer.toHexString(0xff & b);
                          if (hex.length() == 1) hexString.append('0');
                          hexString.append(hex);
                      }}
                      return hexString.substring(0, 16).toUpperCase(Locale.US);
                  }} catch (Exception e) {{
                      return "UNKNOWN_HWID";
                  }}
              }}

              public static String getDeviceHWID() {{
                  return getDeviceHWID(null);
              }}

              public static LicenseInfo verifyLicense(Context context, String licenseKey) {{
                  if (licenseKey == null || licenseKey.trim().isEmpty()) {{
                      return new LicenseInfo(false, "المفتاح فارغ");
                  }}
                  String cleanKey = licenseKey.trim();
                  int dotIndex = cleanKey.indexOf('.');
                  if (dotIndex <= 0 || dotIndex >= cleanKey.length() - 1) {{
                      return new LicenseInfo(false, "تنسيق المفتاح غير صالح");
                  }}
                  try {{
                      String payloadPart = cleanKey.substring(0, dotIndex).trim();
                      String sigPart = cleanKey.substring(dotIndex + 1).trim();

                      byte[] payloadBytes = Base64.decode(payloadPart, Base64.DEFAULT);
                      byte[] sigBytes = Base64.decode(sigPart, Base64.DEFAULT);

                      byte[] keyBytes = Base64.decode(PUBLIC_KEY_BASE64, Base64.DEFAULT);
                      X509EncodedKeySpec keySpec = new X509EncodedKeySpec(keyBytes);
                      KeyFactory keyFactory = KeyFactory.getInstance("RSA");
                      PublicKey pubKey = keyFactory.generatePublic(keySpec);

                      Signature sig = Signature.getInstance("SHA256withRSA");
                      sig.initVerify(pubKey);
                      sig.update(payloadBytes);

                      if (!sig.verify(sigBytes)) {{
                          return new LicenseInfo(false, "التوقيع الرقمي غير صالح");
                      }}

                      JSONObject json = new JSONObject(new String(payloadBytes, "UTF-8"));
                      String licHwid = json.optString("hwid", "");
                      String owner = json.optString("owner", "User");
                      String exp = json.optString("expires_at", "");
                      String tier = json.optString("tier", "VIP");

                      String currentHwid = getDeviceHWID(context);
                      if (!licHwid.equalsIgnoreCase(currentHwid)) {{
                          return new LicenseInfo(false, "المفتاح غير مخصص لهذا الجهاز");
                      }}

                      if (!"LIFETIME".equalsIgnoreCase(exp)) {{
                          SimpleDateFormat sdf = new SimpleDateFormat("yyyy-MM-dd", Locale.US);
                          sdf.setTimeZone(TimeZone.getTimeZone("UTC"));
                          Date expDate = sdf.parse(exp);
                          if (expDate != null && new Date().after(expDate)) {{
                              return new LicenseInfo(false, "انتهت صلاحية الترخيص");
                          }}
                      }}
                      return new LicenseInfo(true, owner, licHwid, exp, tier);
                  }} catch (Exception e) {{
                      return new LicenseInfo(false, e.getMessage());
                  }}
              }}

              public static LicenseInfo verifyAndSave(Context context, String licenseKey) {{
                  LicenseInfo result = verifyLicense(context, licenseKey);
                  if (result.isValid) {{
                      saveLicenseKey(context, licenseKey.trim());
                  }}
                  return result;
              }}

              public static void saveLicenseKey(Context context, String licenseKey) {{
                  try {{
                      File dir = new File(Environment.getExternalStorageDirectory(), "RiyadhRiders");
                      if (!dir.exists()) dir.mkdirs();
                      File licFile = new File(dir, "license.key");
                      FileWriter writer = new FileWriter(licFile);
                      writer.write(licenseKey);
                      writer.flush();
                      writer.close();
                  }} catch (Exception ignored) {{}}

                  if (context != null) {{
                      try {{
                          context.getSharedPreferences("riyadh_rider_lic", Context.MODE_PRIVATE)
                                  .edit().putString("key_data", licenseKey).apply();
                      }} catch (Exception ignored) {{}}
                  }}
              }}

              public static String readSavedKey(Context context) {{
                  try {{
                      File licFile = new File(Environment.getExternalStorageDirectory(), "RiyadhRiders/license.key");
                      if (!licFile.exists()) {{
                          licFile = new File(Environment.getExternalStorageDirectory(), "CamSwap/license.key");
                      }}
                      if (licFile.exists()) {{
                          BufferedReader br = new BufferedReader(new FileReader(licFile));
                          String line = br.readLine();
                          br.close();
                          if (line != null && !line.trim().isEmpty()) {{
                              return line.trim();
                          }}
                      }}
                  }} catch (Exception ignored) {{}}

                  if (context != null) {{
                      try {{
                          return context.getSharedPreferences("riyadh_rider_lic", Context.MODE_PRIVATE)
                                  .getString("key_data", "");
                      }} catch (Exception ignored) {{}}
                  }}
                  return "";
              }}

              public static LicenseInfo checkSavedLicense(Context context) {{
                  String saved = readSavedKey(context);
                  return verifyLicense(context, saved);
              }}

              public static boolean isSystemLicensed() {{
                  LicenseInfo info = checkSavedLicense(null);
                  return info.isValid;
              }}
          }}
          '''
          with open(os.path.join(target_dir, 'LicenseManager.java'), 'w') as f:
              f.write(license_manager_code)

          # 2. كود ActivationActivity.java مع الشعار وزر الواتساب
          activation_activity_code = f'''package {pkg};

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.drawable.Drawable;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.net.URLEncoder;

          public class ActivationActivity extends Activity {{
              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  final String nl = String.valueOf((char)10);

                  ScrollView scrollView = new ScrollView(this);
                  scrollView.setFillViewport(true);
                  scrollView.setBackgroundColor(Color.parseColor("#121212"));

                  final LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(48, 60, 48, 80);
                  layout.setGravity(Gravity.CENTER_HORIZONTAL);

                  // شعار التطبيق
                  ImageView logoView = new ImageView(this);
                  try {{
                      int logoRes = getResources().getIdentifier("app_logo", "drawable", getPackageName());
                      if (logoRes != 0) {{
                          logoView.setImageResource(logoRes);
                      }} else {{
                          Drawable appIcon = getPackageManager().getApplicationIcon(getPackageName());
                          logoView.setImageDrawable(appIcon);
                      }}
                  }} catch (Exception ignored) {{}}

                  LinearLayout.LayoutParams logoParams = new LinearLayout.LayoutParams(220, 220);
                  logoParams.gravity = Gravity.CENTER_HORIZONTAL;
                  logoParams.bottomMargin = 24;
                  logoView.setLayoutParams(logoParams);
                  layout.addView(logoView);

                  // العنوان
                  TextView titleText = new TextView(this);
                  titleText.setText("RiyadhRiders PRO");
                  titleText.setTextSize(24);
                  titleText.setTextColor(Color.WHITE);
                  titleText.setGravity(Gravity.CENTER);
                  layout.addView(titleText);

                  TextView subTitleText = new TextView(this);
                  subTitleText.setText("نظام التفعيل والحماية المشفرة");
                  subTitleText.setTextSize(13);
                  subTitleText.setTextColor(Color.parseColor("#888888"));
                  subTitleText.setGravity(Gravity.CENTER);
                  subTitleText.setPadding(0, 4, 0, 32);
                  layout.addView(subTitleText);

                  // معرّف الجهاز (HWID)
                  final String hwid = LicenseManager.getDeviceHWID(this);
                  TextView hwidLabel = new TextView(this);
                  hwidLabel.setText("معرف جهازك الخاص (Hardware ID):");
                  hwidLabel.setTextSize(13);
                  hwidLabel.setTextColor(Color.parseColor("#AAAAAA"));
                  layout.addView(hwidLabel);

                  final TextView hwidValue = new TextView(this);
                  hwidValue.setText(hwid);
                  hwidValue.setTextSize(17);
                  hwidValue.setTextColor(Color.parseColor("#00E676"));
                  hwidValue.setPadding(0, 8, 0, 16);
                  layout.addView(hwidValue);

                  Button copyBtn = new Button(this);
                  copyBtn.setText("نسخ المعرف (Copy HWID)");
                  copyBtn.setBackgroundColor(Color.parseColor("#1E88E5"));
                  copyBtn.setTextColor(Color.WHITE);
                  copyBtn.setOnClickListener(new View.OnClickListener() {{
                      @Override
                      public void onClick(View v) {{
                          ClipboardManager clipboard = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          ClipData clip = ClipData.newPlainText("HWID", hwid);
                          if (clipboard != null) {{
                              clipboard.setPrimaryClip(clip);
                              Toast.makeText(ActivationActivity.this, "تم نسخ معرف الجهاز بنجاح!", Toast.LENGTH_SHORT).show();
                          }}
                      }}
                  }});
                  layout.addView(copyBtn);

                  // زر شراء مفتاح عبر واتساب
                  TextView contactLabel = new TextView(this);
                  contactLabel.setText("لشراء مفتاح ترخيص، تواصل معنا مباشرة:");
                  contactLabel.setTextSize(13);
                  contactLabel.setTextColor(Color.parseColor("#AAAAAA"));
                  contactLabel.setPadding(0, 32, 0, 10);
                  layout.addView(contactLabel);

                  Button whatsappBtn = new Button(this);
                  whatsappBtn.setText("💬 شراء مفتاح عبر واتساب (WhatsApp)");
                  whatsappBtn.setBackgroundColor(Color.parseColor("#25D366"));
                  whatsappBtn.setTextColor(Color.WHITE);
                  whatsappBtn.setOnClickListener(new View.OnClickListener() {{
                      @Override
                      public void onClick(View v) {{
                          try {{
                              String phone = "966505812141";
                              String message = "Hello, I want to purchase a license key for RiyadhRiders." + nl + "My Device HWID: " + hwid;
                              String encodedMsg = URLEncoder.encode(message, "UTF-8");
                              String waUrl = "https://api.whatsapp.com/send?phone=" + phone + "&text=" + encodedMsg;
                              Intent waIntent = new Intent(Intent.ACTION_VIEW);
                              waIntent.setData(Uri.parse(waUrl));
                              startActivity(waIntent);
                          }} catch (Exception e) {{
                              Toast.makeText(ActivationActivity.this, "تعذر فتح واتساب: " + e.getMessage(), Toast.LENGTH_SHORT).show();
                          }}
                      }}
                  }});
                  layout.addView(whatsappBtn);

                  // حقل إدخال المفتاح
                  TextView keyLabel = new TextView(this);
                  keyLabel.setText("أدخل مفتاح الترخيص هنا:");
                  keyLabel.setTextSize(13);
                  keyLabel.setTextColor(Color.parseColor("#AAAAAA"));
                  keyLabel.setPadding(0, 32, 0, 10);
                  layout.addView(keyLabel);

                  final EditText keyInput = new EditText(this);
                  keyInput.setHint("ألصق المفتاح الكامل هنا...");
                  keyInput.setHintTextColor(Color.GRAY);
                  keyInput.setTextColor(Color.WHITE);
                  keyInput.setBackgroundColor(Color.parseColor("#2C2C2C"));
                  keyInput.setPadding(24, 24, 24, 24);
                  layout.addView(keyInput);

                  Button activateBtn = new Button(this);
                  activateBtn.setText("تفعيل الآن (Activate)");
                  activateBtn.setBackgroundColor(Color.parseColor("#00C853"));
                  activateBtn.setTextColor(Color.WHITE);

                  final TextView statusText = new TextView(this);
                  statusText.setTextSize(15);
                  statusText.setGravity(Gravity.CENTER);
                  statusText.setPadding(0, 24, 0, 16);

                  final Button openAppBtn = new Button(this);
                  openAppBtn.setText("الدخول إلى التطبيق (Open RiyadhRiders)");
                  openAppBtn.setBackgroundColor(Color.parseColor("#7B1FA2"));
                  openAppBtn.setTextColor(Color.WHITE);
                  openAppBtn.setVisibility(View.GONE);
                  openAppBtn.setOnClickListener(new View.OnClickListener() {{
                      @Override
                      public void onClick(View v) {{
                          try {{
                              Class<?> mainClass = Class.forName(getPackageName() + ".MainActivity");
                              Intent mainIntent = new Intent(ActivationActivity.this, mainClass);
                              startActivity(mainIntent);
                              finish();
                          }} catch (Exception e) {{
                              finish();
                          }}
                      }}
                  }});

                  activateBtn.setOnClickListener(new View.OnClickListener() {{
                      @Override
                      public void onClick(View v) {{
                          String input = keyInput.getText().toString().trim();
                          LicenseManager.LicenseInfo result = LicenseManager.verifyAndSave(ActivationActivity.this, input);
                          if (result.isValid) {{
                              statusText.setTextColor(Color.parseColor("#00E676"));
                              statusText.setText("تم التفعيل بنجاح!" + nl + "المالك: " + result.owner + nl + "الباقة: " + result.tier + nl + "الصلاحية: " + result.expiresAt);
                              Toast.makeText(ActivationActivity.this, "تم تفعيل الترخيص بنجاح!", Toast.LENGTH_LONG).show();
                              openAppBtn.setVisibility(View.VISIBLE);
                          }} else {{
                              statusText.setTextColor(Color.parseColor("#FF5252"));
                              statusText.setText("فشل التفعيل: " + result.errorMessage);
                              openAppBtn.setVisibility(View.GONE);
                          }}
                      }}
                  }});

                  layout.addView(activateBtn);
                  layout.addView(statusText);
                  layout.addView(openAppBtn);

                  LicenseManager.LicenseInfo current = LicenseManager.checkSavedLicense(this);
                  if (current.isValid) {{
                      statusText.setTextColor(Color.parseColor("#00E676"));
                      statusText.setText("التطبيق مرخص ومفعل بالفعل" + nl + "المالك: " + current.owner + nl + "الباقة: " + current.tier + nl + "الصلاحية: " + current.expiresAt);
                      openAppBtn.setVisibility(View.VISIBLE);
                  }}

                  scrollView.addView(layout);
                  setContentView(scrollView);
              }}
          }}
          '''
          with open(os.path.join(target_dir, 'ActivationActivity.java'), 'w') as f:
              f.write(activation_activity_code)

          # 3. قفل MainActivity وتحويل المستخدم فوراً لشاشة التفعيل
          main_kt = os.path.join(target_dir, 'MainActivity.kt')
          if os.path.exists(main_kt):
              with open(main_kt, 'r') as f:
                  m_code = f.read()
              if 'ActivationActivity' not in m_code:
                  lock_code = '''
                  val licInfo = LicenseManager.checkSavedLicense(this)
                  if (!licInfo.isValid) {
                      val intent = android.content.Intent(this, ActivationActivity::class.java)
                      startActivity(intent)
                      finish()
                      return
                  }
                  '''
                  m_code = m_code.replace('super.onCreate(savedInstanceState)', 'super.onCreate(savedInstanceState)\n' + lock_code)
                  with open(main_kt, 'w') as f:
                      f.write(m_code)

          main_java = os.path.join(target_dir, 'MainActivity.java')
          if os.path.exists(main_java):
              with open(main_java, 'r') as f:
                  mj_code = f.read()
              if 'ActivationActivity' not in mj_code:
                  lock_j = '''
                  LicenseManager.LicenseInfo licInfo = LicenseManager.checkSavedLicense(this);
                  if (!licInfo.isValid) {
                      android.content.Intent intent = new android.content.Intent(this, ActivationActivity.class);
                      startActivity(intent);
                      finish();
                      return;
                  }
                  '''
                  mj_code = mj_code.replace('super.onCreate(savedInstanceState);', 'super.onCreate(savedInstanceState);\n' + lock_j)
                  with open(main_java, 'w') as f:
                      f.write(mj_code)

          # 4. تسجيل شاشة التفعيل في AndroidManifest.xml
          manifest_path = 'app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  m_content = f.read()
              if 'ActivationActivity' not in m_content:
                  act_decl = f'''
                  <activity
                      android:name=\"{pkg}.ActivationActivity\"
                      android:exported=\"true\"
                      android:label=\"RiyadhRiders PRO\" />
                  '''
                  m_content = m_content.replace('</application>', act_decl + '\n    </application>')
                  with open(manifest_path, 'w') as f:
                      f.write(m_content)

          # 5. قفل HookMain.java
          hook_path = os.path.join(target_dir, 'HookMain.java')
          if os.path.exists(hook_path):
              with open(hook_path, 'r') as f:
                  h_content = f.read()
              h_content = re.sub(r'MODULE_PACKAGE = \"[^\"]+\"', 'MODULE_PACKAGE = \"riyadh.rider.selfi\"', h_content)
              if 'isSystemLicensed' not in h_content:
                  h_content = h_content.replace(
                      'if (lpparam.packageName.equals(MODULE_PACKAGE)) {\n            return;\n        }',
                      'if (lpparam.packageName.equals(MODULE_PACKAGE)) {\n            return;\n        }\n\n        if (!LicenseManager.isSystemLicensed()) {\n            return;\n        }'
                  )
              with open(hook_path, 'w') as f:
                  f.write(h_content)
          EOF
          python3 inject_ui.py

      # 9. قواعد ProGuard وتجاهل تحذيرات Xposed
      - name: Configure ProGuard Rules
        run: |
          mkdir -p app
          cat << 'EOF' >> app/proguard-rules.pro
          -dontwarn de.robv.android.xposed.**
          -dontwarn io.github.zensu357.**
          -dontwarn **
          -keepclasseswithmembernames class * {
              native <methods>;
          }
          -keep class io.github.zensu357.camswap.ActivationActivity { *; }
          -keep class io.github.zensu357.camswap.LicenseManager { *; }
          EOF

      # 10. توليد شهادة التوقيع وإعداد Gradle ليوقع تلقائياً
      - name: Configure Automatic Release Signing in Gradle
        run: |
          mkdir -p app
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias release_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "pass123456" \
            -keypass "pass123456" \
            -dname "CN=RiyadhRiders, O=Security, C=SA"

          cat << 'EOF' > setup_signing.py
          with open('app/build.gradle', 'r') as f:
              content = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'pass123456'
                      keyAlias 'release_key'
                      keyPassword 'pass123456'
                  }
              }
          '''
          if 'signingConfigs' not in content:
              content = content.replace('buildTypes {', signing_block + '\n    buildTypes {')
              content = content.replace('release {', 'release {\n            signingConfig signingConfigs.release')
              with open('app/build.gradle', 'w') as f:
                  f.write(content)
              print("Gradle release signing configured.")
          EOF
          python3 setup_signing.py

      # 11. تجميع وبناء الـ APK باسم وحزمة RiyadhRiders
      - name: Build Protected Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x lintVitalRelease -x test --stacktrace --no-daemon 2>&1 | tee build_log.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ تفاصيل خطأ البناء:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -B 2 -A 40 "FAILURE:" build_log.txt >> $GITHUB_STEP_SUMMARY || tail -n 60 build_log.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      # 12. رفع ملفات الـ APK الموقعة باسم RiyadhRiders
      - name: Upload Final Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: RiyadhRiders-Release-APK
          path: app/build/outputs/apk/release/*.apk

      # 13. رفع المفتاح الخاص للمطور
      - name: Upload Developer Private Key
        uses: actions/upload-artifact@v4
        with:
          name: Developer-Private-Key-DO-NOT-SHARE
          path: keys_output/private_key.pem

      # 14. تقرير الخطأ التلقائي دائماً في Summary
      - name: Report Failure Summary
        if: failure()
        run: |
          echo "## ⚠️ تقرير الخطأ التلقائي (Workflow Failure Report)" >> $GITHUB_STEP_SUMMARY
          if [ -f build_log.txt ]; then
            echo "### تفاصيل الخطأ من سجل التجميع:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -B 2 -A 40 "FAILURE:" build_log.txt >> $GITHUB_STEP_SUMMARY \vert{}\vert{} tail -n 60 build_log.txt >>$GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
