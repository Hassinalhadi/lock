name: Build Riders Soloution Pk KeyGen APK

on:
  workflow_dispatch:

jobs:
  build-keygen:
    runs-on: ubuntu-latest

    steps:
      # 1. تنزيل الكود
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. إعداد بيئة بايثون
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. استبدال سيرفرات علي بابا بالمستودعات الرسمية
      - name: Replace Aliyun Mirrors with Official Repositories
        run: |
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/repository/public|https://repo1.maven.org/maven2|g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/repository/jcenter|https://repo1.maven.org/maven2|g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/[^'\''"]*|https://repo1.maven.org/maven2|g' {} +
          echo "Official repositories configured."

      # 5. إعداد هيكل مشروع تطبيق المولد المستقل
      - name: Configure KeyGen Application Project
        run: |
          rm -rf app/src/main/java
          rm -rf app/src/main/res
          rm -rf app/src/main/cpp
          rm -rf app/src/main/resources
          rm -rf app/build

          mkdir -p app/src/main/java/pk/riders/keygen
          mkdir -p app/src/main/res/values

          # ملف AndroidManifest.xml بالإنجليزية
          cat << 'PYEOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="pk.riders.keygen">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="false"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          PYEOF

          # ملف strings.xml
          cat << 'PYEOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Riders Soloution Pk KeyGen</string>
          </resources>
          PYEOF

          # ملف build.gradle
          cat << 'PYEOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'pk.riders.keygen'
              compileSdk 34

              defaultConfig {
                  applicationId "pk.riders.keygen"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'pass123456'
                      keyAlias 'release_key'
                      keyPassword 'pass123456'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          PYEOF

          # توليد شهادة التوقيع الرسمية
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias release_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "pass123456" \
            -keypass "pass123456" \
            -dname "CN=KeyGen, O=RidersSoloutionPk, C=SA"

      # 6. كتابة كود تطبيق المولد كاملاً باللغة الإنجليزية وواتساب فقط
      - name: Write KeyGen MainActivity
        run: |
          cat << 'PYEOF' > app/src/main/java/pk/riders/keygen/MainActivity.java.raw
          package pk.riders.keygen;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.app.DatePickerDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.net.URLEncoder;
          import java.security.KeyFactory;
          import java.security.PrivateKey;
          import java.security.Signature;
          import java.security.spec.PKCS8EncodedKeySpec;
          import java.util.Calendar;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private EditText etHwid, etOwner;
              private TextView tvSelectedDate, tvResultKey, tvKeyStatus;
              private Spinner spTier;
              private String selectedExpiry = "LIFETIME";
              private LinearLayout historyLayout;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scrollView = new ScrollView(this);
                  scrollView.setFillViewport(true);
                  scrollView.setBackgroundColor(Color.parseColor("#121212"));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(40, 50, 40, 60);

                  TextView title = new TextView(this);
                  title.setText("Riders Soloution Pk KeyGen");
                  title.setTextSize(22);
                  title.setTextColor(Color.parseColor("#00E676"));
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  tvKeyStatus = new TextView(this);
                  tvKeyStatus.setGravity(Gravity.CENTER);
                  tvKeyStatus.setPadding(0, 10, 0, 20);
                  root.addView(tvKeyStatus);
                  updateKeyStatus();

                  Button btnSetKey = new Button(this);
                  btnSetKey.setText("🔑 Configure Private Key (private_key.pem)");
                  btnSetKey.setBackgroundColor(Color.parseColor("#37474F"));
                  btnSetKey.setTextColor(Color.WHITE);
                  btnSetKey.setOnClickListener(v -> showSetKeyDialog());
                  root.addView(btnSetKey);

                  root.addView(createLabel("Client Hardware ID (HWID):"));
                  etHwid = new EditText(this);
                  etHwid.setHint("Paste client HWID here...");
                  etHwid.setHintTextColor(Color.GRAY);
                  etHwid.setTextColor(Color.WHITE);
                  etHwid.setBackgroundColor(Color.parseColor("#222222"));
                  etHwid.setPadding(24, 24, 24, 24);
                  root.addView(etHwid);

                  root.addView(createLabel("Client Name / Note:"));
                  etOwner = new EditText(this);
                  etOwner.setHint("e.g. VIP Customer / John...");
                  etOwner.setHintTextColor(Color.GRAY);
                  etOwner.setTextColor(Color.WHITE);
                  etOwner.setBackgroundColor(Color.parseColor("#222222"));
                  etOwner.setPadding(24, 24, 24, 24);
                  root.addView(etOwner);

                  root.addView(createLabel("License Tier:"));
                  spTier = new Spinner(this);
                  ArrayAdapter<String> adapter = new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, new String[]{"VIP", "PRO", "ULTIMATE"});
                  spTier.setAdapter(adapter);
                  root.addView(spTier);

                  root.addView(createLabel("Validity Period:"));
                  tvSelectedDate = new TextView(this);
                  tvSelectedDate.setText("Expiry: Lifetime Access (LIFETIME)");
                  tvSelectedDate.setTextColor(Color.parseColor("#00E676"));
                  tvSelectedDate.setTextSize(15);
                  tvSelectedDate.setPadding(0, 10, 0, 15);
                  root.addView(tvSelectedDate);

                  LinearLayout dateBtns1 = new LinearLayout(this);
                  dateBtns1.setOrientation(LinearLayout.HORIZONTAL);
                  addQuickDateBtn(dateBtns1, "1 Month", 30);
                  addQuickDateBtn(dateBtns1, "3 Months", 90);
                  addQuickDateBtn(dateBtns1, "1 Year", 365);
                  root.addView(dateBtns1);

                  LinearLayout dateBtns2 = new LinearLayout(this);
                  dateBtns2.setOrientation(LinearLayout.HORIZONTAL);

                  Button btnCalendar = new Button(this);
                  btnCalendar.setText("📅 Custom Calendar");
                  btnCalendar.setBackgroundColor(Color.parseColor("#1E88E5"));
                  btnCalendar.setTextColor(Color.WHITE);
                  btnCalendar.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f));
                  btnCalendar.setOnClickListener(v -> showDatePicker());
                  dateBtns2.addView(btnCalendar);

                  Button btnLifetime = new Button(this);
                  btnLifetime.setText("♾️ Lifetime");
                  btnLifetime.setBackgroundColor(Color.parseColor("#424242"));
                  btnLifetime.setTextColor(Color.WHITE);
                  btnLifetime.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f));
                  btnLifetime.setOnClickListener(v -> {
                      selectedExpiry = "LIFETIME";
                      tvSelectedDate.setText("Expiry: Lifetime Access (LIFETIME)");
                  });
                  dateBtns2.addView(btnLifetime);
                  root.addView(dateBtns2);

                  Button btnGen = new Button(this);
                  btnGen.setText("⚡ Generate License & Save Device");
                  btnGen.setBackgroundColor(Color.parseColor("#00C853"));
                  btnGen.setTextColor(Color.WHITE);
                  btnGen.setTextSize(16);
                  btnGen.setPadding(0, 24, 0, 24);
                  LinearLayout.LayoutParams genParams = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  genParams.topMargin = 30;
                  btnGen.setLayoutParams(genParams);
                  btnGen.setOnClickListener(v -> generateAndSaveKey());
                  root.addView(btnGen);

                  root.addView(createLabel("Generated License Key:"));
                  tvResultKey = new TextView(this);
                  tvResultKey.setTextIsSelectable(true);
                  tvResultKey.setTextColor(Color.WHITE);
                  tvResultKey.setBackgroundColor(Color.parseColor("#1E1E1E"));
                  tvResultKey.setPadding(24, 24, 24, 24);
                  root.addView(tvResultKey);

                  LinearLayout actionBtns = new LinearLayout(this);
                  actionBtns.setOrientation(LinearLayout.HORIZONTAL);

                  Button btnCopy = new Button(this);
                  btnCopy.setText("📋 Copy");
                  btnCopy.setBackgroundColor(Color.parseColor("#1976D2"));
                  btnCopy.setTextColor(Color.WHITE);
                  btnCopy.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f));
                  btnCopy.setOnClickListener(v -> {
                      String k = tvResultKey.getText().toString().trim();
                      if (!k.isEmpty()) {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cm.setPrimaryClip(ClipData.newPlainText("License", k));
                          Toast.makeText(this, "License key copied to clipboard!", Toast.LENGTH_SHORT).show();
                      }
                  });
                  actionBtns.addView(btnCopy);

                  # زر واتساب بالرقم الجديد والرسالة التلقائية المسبقة (بدون تليجرام)
                  Button btnWa = new Button(this);
                  btnWa.setText("💬 WhatsApp (+966547425565)");
                  btnWa.setBackgroundColor(Color.parseColor("#25D366"));
                  btnWa.setTextColor(Color.WHITE);
                  btnWa.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 2.0f));
                  btnWa.setOnClickListener(v -> shareViaWhatsApp());
                  actionBtns.addView(btnWa);
                  root.addView(actionBtns);

                  TextView historyHeader = new TextView(this);
                  historyHeader.setText("📋 Registered Devices & Issued Keys:");
                  historyHeader.setTextSize(18);
                  historyHeader.setTextColor(Color.WHITE);
                  historyHeader.setPadding(0, 40, 0, 16);
                  root.addView(historyHeader);

                  historyLayout = new LinearLayout(this);
                  historyLayout.setOrientation(LinearLayout.VERTICAL);
                  root.addView(historyLayout);

                  loadHistory();

                  scrollView.addView(root);
                  setContentView(scrollView);
              }

              private void addQuickDateBtn(LinearLayout parent, String title, int days) {
                  Button btn = new Button(this);
                  btn.setText(title);
                  btn.setBackgroundColor(Color.parseColor("#2A2A2A"));
                  btn.setTextColor(Color.WHITE);
                  btn.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f));
                  btn.setOnClickListener(v -> {
                      Calendar c = Calendar.getInstance();
                      c.add(Calendar.DAY_OF_YEAR, days);
                      selectedExpiry = String.format(Locale.US, "%04d-%02d-%02d", c.get(Calendar.YEAR), c.get(Calendar.MONTH) + 1, c.get(Calendar.DAY_OF_MONTH));
                      tvSelectedDate.setText("Expiry (" + title + "): " + selectedExpiry);
                  });
                  parent.addView(btn);
              }

              private TextView createLabel(String text) {
                  TextView tv = new TextView(this);
                  tv.setText(text);
                  tv.setTextColor(Color.parseColor("#AAAAAA"));
                  tv.setPadding(0, 24, 0, 8);
                  return tv;
              }

              private void updateKeyStatus() {
                  SharedPreferences prefs = getSharedPreferences("keygen_cfg", MODE_PRIVATE);
                  String savedKey = prefs.getString("priv_key", "");
                  if (!savedKey.isEmpty()) {
                      tvKeyStatus.setText("🟢 Private Key Ready & Loaded");
                      tvKeyStatus.setTextColor(Color.parseColor("#00E676"));
                  } else {
                      tvKeyStatus.setText("🔴 Private Key Not Set (Click button below)");
                      tvKeyStatus.setTextColor(Color.parseColor("#FF5252"));
                  }
              }

              private void showSetKeyDialog() {
                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle("Configure Private Key (private_key.pem)");

                  final EditText input = new EditText(this);
                  input.setHint("Paste the full private_key.pem content here...");
                  SharedPreferences prefs = getSharedPreferences("keygen_cfg", MODE_PRIVATE);
                  input.setText(prefs.getString("priv_key", ""));
                  builder.setView(input);

                  builder.setPositiveButton("Save", (dialog, which) -> {
                      String val = input.getText().toString().trim();
                      prefs.edit().putString("priv_key", val).apply();
                      updateKeyStatus();
                      Toast.makeText(this, "Private key saved successfully!", Toast.LENGTH_SHORT).show();
                  });
                  builder.setNegativeButton("Cancel", null);
                  builder.show();
              }

              private void showDatePicker() {
                  Calendar c = Calendar.getInstance();
                  new DatePickerDialog(this, (view, year, month, dayOfMonth) -> {
                      selectedExpiry = String.format(Locale.US, "%04d-%02d-%02d", year, month + 1, dayOfMonth);
                      tvSelectedDate.setText("Selected Expiry Date: " + selectedExpiry);
                  }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH)).show();
              }

              private void generateAndSaveKey() {
                  String hwid = etHwid.getText().toString().trim().toUpperCase();
                  String owner = etOwner.getText().toString().trim();
                  if (owner.isEmpty()) owner = "Customer";
                  String tier = spTier.getSelectedItem().toString();

                  if (hwid.isEmpty()) {
                      Toast.makeText(this, "Please enter customer HWID!", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  SharedPreferences prefs = getSharedPreferences("keygen_cfg", MODE_PRIVATE);
                  String rawPem = prefs.getString("priv_key", "").trim();
                  if (rawPem.isEmpty()) {
                      Toast.makeText(this, "Please configure private key first using the button above!", Toast.LENGTH_LONG).show();
                      showSetKeyDialog();
                      return;
                  }

                  try {
                      String cleanKey = rawPem.replace("-----BEGIN PRIVATE KEY-----", "")
                                              .replace("-----END PRIVATE KEY-----", "")
                                              .replace("-----BEGIN RSA PRIVATE KEY-----", "")
                                              .replace("-----END RSA PRIVATE KEY-----", "")
                                              .replaceAll("\\s+", "");

                      byte[] keyBytes = Base64.decode(cleanKey, Base64.DEFAULT);
                      PKCS8EncodedKeySpec spec = new PKCS8EncodedKeySpec(keyBytes);
                      KeyFactory kf = KeyFactory.getInstance("RSA");
                      PrivateKey priv = kf.generatePrivate(spec);

                      JSONObject payload = new JSONObject();
                      payload.put("hwid", hwid);
                      payload.put("owner", owner);
                      payload.put("expires_at", selectedExpiry);
                      payload.put("tier", tier);

                      byte[] payloadBytes = payload.toString().getBytes("UTF-8");

                      Signature sig = Signature.getInstance("SHA256withRSA");
                      sig.initSign(priv);
                      sig.update(payloadBytes);
                      byte[] sigBytes = sig.sign();

                      String finalKey = Base64.encodeToString(payloadBytes, Base64.NO_WRAP) + "." + Base64.encodeToString(sigBytes, Base64.NO_WRAP);
                      tvResultKey.setText(finalKey);

                      saveDeviceRecord(hwid, owner, tier, selectedExpiry, finalKey);
                      loadHistory();
                      Toast.makeText(this, "License generated & device saved successfully!", Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "Generation error: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }

              private void shareViaWhatsApp() {
                  String key = tvResultKey.getText().toString().trim();
                  if (key.isEmpty()) return;
                  try {
                      String msg = "Your Riders Soloution Pk Activation Key:\n\n" + key + "\n\nPaste this license key into the application and tap Activate.";
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      intent.setData(Uri.parse("https://api.whatsapp.com/send?phone=966547425565&text=" + URLEncoder.encode(msg, "UTF-8")));
                      startActivity(intent);
                  } catch (Exception e) {
                      Toast.makeText(this, "Unable to launch WhatsApp", Toast.LENGTH_SHORT).show();
                  }
              }

              private void saveDeviceRecord(String hwid, String owner, String tier, String expiry, String key) {
                  SharedPreferences prefs = getSharedPreferences("keygen_db", Context.MODE_PRIVATE);
                  try {
                      JSONArray arr = new JSONArray(prefs.getString("devices", "[]"));
                      JSONObject obj = new JSONObject();
                      obj.put("hwid", hwid);
                      obj.put("owner", owner);
                      obj.put("tier", tier);
                      obj.put("expiry", expiry);
                      obj.put("key", key);
                      obj.put("active", true);
                      arr.put(obj);
                      prefs.edit().putString("devices", arr.toString()).apply();
                  } catch (Exception ignored) {}
              }

              private void loadHistory() {
                  historyLayout.removeAllViews();
                  SharedPreferences prefs = getSharedPreferences("keygen_db", Context.MODE_PRIVATE);
                  try {
                      JSONArray arr = new JSONArray(prefs.getString("devices", "[]"));
                      for (int i = arr.length() - 1; i >= 0; i--) {
                          JSONObject item = arr.getJSONObject(i);
                          final int idx = i;
                          LinearLayout card = new LinearLayout(this);
                          card.setOrientation(LinearLayout.VERTICAL);
                          card.setBackgroundColor(Color.parseColor("#1E1E1E"));
                          card.setPadding(28, 24, 28, 24);
                          LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                          lp.bottomMargin = 16;
                          card.setLayoutParams(lp);

                          boolean active = item.optBoolean("active", true);
                          TextView info = new TextView(this);
                          info.setText(item.optString("owner") + " (" + item.optString("tier") + ")" + "\nHWID: " + item.optString("hwid") + "\nExpiry: " + item.optString("expiry") + "\nStatus: " + (active ? "🟢 Active" : "🔴 Revoked"));
                          info.setTextColor(active ? Color.WHITE : Color.parseColor("#FF5252"));
                          info.setTextSize(14);
                          card.addView(info);

                          LinearLayout btns = new LinearLayout(this);
                          btns.setOrientation(LinearLayout.HORIZONTAL);
                          btns.setPadding(0, 12, 0, 0);

                          Button btnCopy = new Button(this);
                          btnCopy.setText("Copy Key");
                          btnCopy.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f));
                          btnCopy.setOnClickListener(v -> {
                              ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                              cm.setPrimaryClip(ClipData.newPlainText("Key", item.optString("key")));
                              Toast.makeText(MainActivity.this, "License key copied!", Toast.LENGTH_SHORT).show();
                          });
                          btns.addView(btnCopy);

                          Button btnRevoke = new Button(this);
                          btnRevoke.setText(active ? "Revoke Device" : "Reactivate");
                          btnRevoke.setBackgroundColor(active ? Color.parseColor("#C62828") : Color.parseColor("#2E7D32"));
                          btnRevoke.setTextColor(Color.WHITE);
                          btnRevoke.setLayoutParams(new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f));
                          btnRevoke.setOnClickListener(v -> {
                              try {
                                  item.put("active", !active);
                                  arr.put(idx, item);
                                  prefs.edit().putString("devices", arr.toString()).apply();
                                  loadHistory();
                              } catch (Exception ignored) {}
                          });
                          btns.addView(btnRevoke);
                          card.addView(btns);

                          historyLayout.addView(card);
                      }
                  } catch (Exception ignored) {}
              }
          }
          PYEOF
          python3 -c "import textwrap; open('app/src/main/java/pk/riders/keygen/MainActivity.java', 'w').write(textwrap.dedent(open('app/src/main/java/pk/riders/keygen/MainActivity.java.raw').read()))"

      # 7. تجميع وبناء تطبيق المولد APK
      - name: Build KeyGen Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test --stacktrace --no-daemon 2>&1 | tee keygen_build.log
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "## ❌ Build Failure Details:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            grep -B 2 -A 50 "FAILURE:" keygen_build.log >> $GITHUB_STEP_SUMMARY || tail -n 60 keygen_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $EXIT_CODE
          fi

      # 8. رفع ملف الـ APK النهائي إلى قسم Artifacts
      - name: Upload KeyGen APK
        uses: actions/upload-artifact@v4
        with:
          name: Riders-Soloution-Pk-KeyGen-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
