name: Build Android APK

on:
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بنقرة زر في أي وقت
  push:
    branches: [ main, master ] # يبدأ البناء تلقائياً عند رفع أي تعديل على هذه الفروع

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب ملفات الكود من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. تثبيت بيئة جافا (JDK 17) المتوافقة مع أندرويد
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. إعطاء صلاحية التشغيل لأداة بناء Gradle
      - name: Grant Execute Permission
        run: chmod +x gradlew

      # 4. بناء وتجميع ملف APK
      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      # 5. رفع ملف الـ APK الناتج لتتمكن من تنزيله
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
