name: Build Riders Soloution Pk & Embedded KeyGen APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. تنزيل الكود
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة جافا
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. إعداد بايثون والمكتبات اللازمة
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --no-cache-dir Pillow

      # 4. توجيه المستودعات إلى السيرفرات الرسمية
      - name: Configure Official Maven Repositories
        run: |
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/repository/public|https://repo1.maven.org/maven2|g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/repository/jcenter|https://repo1.maven.org/maven2|g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/[^'\''"]*|https://repo1.maven.org/maven2|g' {} +

      # 5. توليد مفاتيح التشفير RSA-2048 بصيغة PKCS#8
      - name: Generate RSA-2048 Key Pair
        run: |
          mkdir -p keys_output
          openssl genrsa -out keys_output/private_raw.pem 2048
          openssl pkcs8 -topk8 -inform PEM -outform DER -in keys_output/private_raw.pem -out keys_output/private_key.pk8 -nocrypt
          openssl rsa -in keys_output/private_raw.pem -pubout -out keys_output/public_key.pem
          cp keys_output/private_raw.pem keys_output/private_key.pem
          
          # استخراج المفتاح الخاص بصيغة Base64 سطر واحد لدمجه برمجياً داخل تطبيق KeyGen
          base64 -w 0 keys_output/private_key.pk8 > keys_output/private_key_b64.txt
          echo "RSA keys successfully generated."

      # 6. تجهيز شعار التطبيق وأيقونات النظام
      - name: Process Brand Logo and Icons
        run: |
          cat << 'PYEOF' > prepare_icons.py
          import os
          from PIL import Image

          img_file = None
          for ext in ['logo.png', 'logo.jpg', 'logo.jpeg', 'icon.png', 'icon.jpg']:
              if os.path.exists(ext):
                  img_file = ext
                  break
          if not img_file:
              for f in os.listdir('.'):
                  if f.lower().endswith(('.png', '.jpg', '.jpeg')) and not f.startswith('.'):
                      img_file = f
                      break

          if img_file:
              print(f"Found brand image: {img_file}")
              base_img = Image.open(img_file).convert("RGBA")
              densities = {
                  'mipmap-mdpi': (48, 48),
                  'mipmap-hdpi': (72, 72),
                  'mipmap-xhdpi': (96, 96),
                  'mipmap-xxhdpi': (144, 144),
                  'mipmap-xxxhdpi': (192, 192),
                  'drawable': (512, 512)
              }
              res_dir = 'app/src/main/res'
              for folder, size in densities.items():
                  target_dir = os.path.join(res_dir, folder)
                  os.makedirs(target_dir, exist_ok=True)
                  for old in os.listdir(target_dir):
                      if 'ic_launcher' in old or 'logo' in old:
                          os.remove(os.path.join(target_dir, old))
                  resized = base_img.resize(size, Image.Resampling.LANCZOS)
                  resized.save(os.path.join(target_dir, 'ic_launcher.png'))
                  resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))
                  resized.save(os.path.join(target_dir, 'app_logo.png'))
          PYEOF
          python3 prepare_icons.py

      # 7. تجهيز مفتاح توقيع APK (Keystore)
      - name: Generate Signing Keystore
        run: |
          keytool -genkey -v -keystore app/release.keystore -alias riders_alias \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password123 -keypass password123 \
            -dname "CN=RidersSoloution, OU=Mobile, O=RidersSoloutionPk, L=Riyadh, C=SA"

      # 8. ضبط إعدادات توقيع تطبيق الكاميرا الأساسي
      - name: Configure Main App Signing & Proguard
        run: |
          cat << 'PYEOF' > patch_gradle.py
          import re

          with open('app/build.gradle', 'r') as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'password123'
                      keyAlias 'riders_alias'
                      keyPassword 'password123'
                  }
              }
          """
          if 'signingConfigs {' not in content:
              content = re.sub(r'android\s*\{', r'android {\n' + signing_block, content, count=1)

          if 'signingConfig signingConfigs.release' not in content:
              content = re.sub(r'buildTypes\s*\{\s*release\s*\{', r'buildTypes {\n        release {\n            signingConfig signingConfigs.release', content, count=1)

          with open('app/build.gradle', 'w') as f:
              f.write(content)

          if os.path.exists('app/proguard-rules.pro'):
              with open('app/proguard-rules.pro', 'a') as f:
                  f.write("\n-dontwarn de.robv.android.xposed.**\n-keep class de.robv.android.xposed.** { *; }\n")
          PYEOF
          python3 patch_gradle.py

      # 9. بناء تطبيق الكاميرا الأساسي
      - name: Build Main Camera APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace
          mkdir -p final_output
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} final_output/RidersSoloutionPk.apk \;

      # 10. إعداد وتكوين تطبيق KeyGen مع المفتاح المدمج وواجهة إنجليزية بالكامل
      - name: Build Embedded KeyGen APK
        run: |
          PRIV_KEY_B64=$(cat keys_output/private_key_b64.txt)
          
          # تنظيف الكود القديم لإعادة بناء المولد
          rm -rf app/src/main/java
          rm -rf app/src/main/res/layout
          rm -rf app/src/main/res/values*
          rm -rf app/build

          mkdir -p app/src/main/java/riders/soloution/keygen
          mkdir -p app/src/main/res/values

          # ملف AndroidManifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="riders.soloution.keygen">

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/keygen_app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="false"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # نصوص الواجهة بالإنجليزية حصراً
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="keygen_app_name">Riders Soloution Pk - KeyGen</string>
          </resources>
          EOF

          # كود تطبيق المولد بلغة جافا مع المفتاح الخاص المدمج
          cat << EOF > app/src/main/java/riders/soloution/keygen/MainActivity.java
          package riders.soloution.keygen;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import java.nio.charset.StandardCharsets;
          import java.security.KeyFactory;
          import java.security.PrivateKey;
          import java.security.Signature;
          import java.security.spec.PKCS8EncodedKeySpec;
          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Locale;

          public class MainActivity extends Activity {
              // Embedded RSA-2048 Private Key
              private static final String EMBEDDED_KEY = "$PRIV_KEY_B64";
              private static final String WHATSAPP_NUM = "966547425565";

              private EditText hwidInput;
              private Spinner validitySpinner;
              private TextView resultText;
              private String generatedLicense = "";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scrollView = new ScrollView(this);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(40, 50, 40, 50);
                  layout.setGravity(Gravity.CENTER_HORIZONTAL);

                  // Header Logo / Icon
                  ImageView logoView = new ImageView(this);
                  int logoId = getResources().getIdentifier("app_logo", "drawable", getPackageName());
                  if (logoId != 0) {
                      logoView.setImageResource(logoId);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(220, 220);
                      lp.bottomMargin = 25;
                      logoView.setLayoutParams(lp);
                      layout.addView(logoView);
                  }

                  // Title
                  TextView title = new TextView(this);
                  title.setText("Riders Soloution Pk");
                  title.setTextSize(22);
                  title.setTypeface(null, android.graphics.Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  layout.addView(title);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("License Key Generator (Official)");
                  subtitle.setTextSize(14);
                  subtitle.setTextColor(0xFF888888);
                  subtitle.setGravity(Gravity.CENTER);
                  layout.addView(subtitle);

                  // Support WhatsApp Info
                  TextView supportText = new TextView(this);
                  supportText.setText("WhatsApp Support: +966 54 742 5565");
                  supportText.setTextSize(13);
                  supportText.setTextColor(0xFF25D366);
                  supportText.setGravity(Gravity.CENTER);
                  supportText.setPadding(0, 15, 0, 30);
                  layout.addView(supportText);

                  // HWID Input Label
                  TextView hwidLabel = new TextView(this);
                  hwidLabel.setText("Device Hardware ID (HWID):");
                  hwidLabel.setTextSize(14);
                  layout.addView(hwidLabel);

                  hwidInput = new EditText(this);
                  hwidInput.setHint("Paste client HWID here");
                  layout.addView(hwidInput);

                  // Validity Period
                  TextView validityLabel = new TextView(this);
                  validityLabel.setText("License Duration:");
                  validityLabel.setTextSize(14);
                  validityLabel.setPadding(0, 25, 0, 10);
                  layout.addView(validityLabel);

                  validitySpinner = new Spinner(this);
                  String[] durations = {"1 Month (30 Days)", "3 Months (90 Days)", "6 Months (180 Days)", "1 Year (365 Days)", "Lifetime (10 Years)"};
                  ArrayAdapter<String> adapter = new ArrayAdapter<>(this, android.R.layout.simple_spinner_dropdown_item, durations);
                  validitySpinner.setAdapter(adapter);
                  layout.addView(validitySpinner);

                  // Generate Button
                  Button generateBtn = new Button(this);
                  generateBtn.setText("GENERATE LICENSE");
                  generateBtn.setPadding(0, 25, 0, 25);
                  LinearLayout.LayoutParams btnLp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  btnLp.topMargin = 35;
                  generateBtn.setLayoutParams(btnLp);
                  layout.addView(generateBtn);

                  // Output Result
                  resultText = new EditText(this);
                  resultText.setHint("Generated license will appear here");
                  resultText.setTextIsSelectable(true);
                  resultText.setMinLines(3);
                  resultText.setPadding(20, 20, 20, 20);
                  resultText.setBackgroundColor(0xFFF0F0F0);
                  resultText.setTextColor(0xFF000000);
                  LinearLayout.LayoutParams resLp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  resLp.topMargin = 25;
                  resultText.setLayoutParams(resLp);
                  layout.addView(resultText);

                  // Action Buttons Layout
                  LinearLayout actionsLayout = new LinearLayout(this);
                  actionsLayout.setOrientation(LinearLayout.HORIZONTAL);
                  actionsLayout.setWeightSum(2);
                  actionsLayout.setPadding(0, 20, 0, 0);

                  Button copyBtn = new Button(this);
                  copyBtn.setText("COPY KEY");
                  LinearLayout.LayoutParams actLp1 = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f);
                  actLp1.rightMargin = 10;
                  copyBtn.setLayoutParams(actLp1);
                  actionsLayout.addView(copyBtn);

                  Button shareBtn = new Button(this);
                  shareBtn.setText("WHATSAPP");
                  LinearLayout.LayoutParams actLp2 = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f);
                  actLp2.leftMargin = 10;
                  shareBtn.setLayoutParams(actLp2);
                  actionsLayout.addView(shareBtn);

                  layout.addView(actionsLayout);
                  scrollView.addView(layout);
                  setContentView(scrollView);

                  // Button Actions
                  generateBtn.setOnClickListener(v -> generateLicenseKey());

                  copyBtn.setOnClickListener(v -> {
                      if (generatedLicense.isEmpty()) {
                          Toast.makeText(this, "Please generate a key first", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("License", generatedLicense));
                      Toast.makeText(this, "Key copied to clipboard", Toast.LENGTH_SHORT).show();
                  });

                  shareBtn.setOnClickListener(v -> {
                      if (generatedLicense.isEmpty()) {
                          Toast.makeText(this, "Please generate a key first", Toast.LENGTH_SHORT).show();
                          return;
                      }
                      String msg = "Hello! Here is your activation license for Riders Soloution Pk:\n\n" + generatedLicense + "\n\nSupport WhatsApp: +" + WHATSAPP_NUM;
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      intent.setData(Uri.parse("https://api.whatsapp.com/send?text=" + Uri.encode(msg)));
                      startActivity(intent);
                  });
              }

              private void generateLicenseKey() {
                  String hwid = hwidInput.getText().toString().trim();
                  if (hwid.isEmpty()) {
                      Toast.makeText(this, "Please enter client HWID", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  int days = 30;
                  int pos = validitySpinner.getSelectedItemPosition();
                  if (pos == 1) days = 90;
                  else if (pos == 2) days = 180;
                  else if (pos == 3) days = 365;
                  else if (pos == 4) days = 3650;

                  Calendar cal = Calendar.getInstance();
                  cal.add(Calendar.DAY_OF_YEAR, days);
                  String expDate = new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(cal.getTime());

                  String rawData = hwid + "|" + expDate;

                  try {
                      byte[] keyBytes = Base64.decode(EMBEDDED_KEY, Base64.DEFAULT);
                      PKCS8EncodedKeySpec spec = new PKCS8EncodedKeySpec(keyBytes);
                      KeyFactory kf = KeyFactory.getInstance("RSA");
                      PrivateKey priv = kf.generatePrivate(spec);

                      Signature sig = Signature.getInstance("SHA256withRSA");
                      sig.initSign(priv);
                      sig.update(rawData.getBytes(StandardCharsets.UTF_8));
                      byte[] sigBytes = sig.sign();

                      String sigB64 = Base64.encodeToString(sigBytes, Base64.NO_WRAP);
                      String payload = rawData + "::" + sigB64;
                      generatedLicense = Base64.encodeToString(payload.getBytes(StandardCharsets.UTF_8), Base64.NO_WRAP);

                      resultText.setText(generatedLicense);
                      Toast.makeText(this, "License generated successfully!", Toast.LENGTH_SHORT).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "Signing error: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }
              }
          }
          EOF

          # تحديث build.gradle الخاص بتطبيق KeyGen
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'riders.soloution.keygen'
              compileSdk 34

              defaultConfig {
                  applicationId "riders.soloution.keygen"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'password123'
                      keyAlias 'riders_alias'
                      keyPassword 'password123'
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          EOF

          # بناء تطبيق KeyGen
          ./gradlew assembleRelease --stacktrace
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} final_output/RidersSoloutionPk_KeyGen.apk \;

      # 11. رفع التطبيقات والمفاتيح كـ Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Riders-Soloution-Pk-Build
          path: |
            final_output/*.apk
            keys_output/private_key.pem
            keys_output/public_key.pem

      # 12. نشر إصدار مباشر على GitHub Releases للتحميل المباشر
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0-$(date +'%Y%m%d%H%M%S')"
          gh release create "$TAG_NAME" \
            final_output/RidersSoloutionPk.apk \
            final_output/RidersSoloutionPk_KeyGen.apk \
            keys_output/private_key.pem \
            --title "Riders Soloution Pk Release" \
            --notes "Generated APKs for Riders Soloution Pk and Embedded KeyGen APK with WhatsApp Support (+966547425565)."
