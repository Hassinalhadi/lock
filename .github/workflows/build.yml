name: Full Automated Secure Build & Licensing

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-and-protect:
    runs-on: ubuntu-latest

    steps:
      # 1. تنزيل الكود مع الفروع الفرعية
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. إعداد بيئة جافا وبايثون
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Crypto Library
        run: pip install cryptography

      # 3. توفير ملف dobby.h إذا لم يكن موجوداً لضمان نجاح C++
      - name: Ensure Dobby C++ Headers Exist
        run: |
          DOBBY_INC="app/src/main/cpp/third_party/Dobby/include"
          mkdir -p "$DOBBY_INC"
          if [ ! -f "$DOBBY_INC/dobby.h" ]; then
            cat << 'EOF' > "$DOBBY_INC/dobby.h"
          #pragma once
          #include <dlfcn.h>
          #ifdef __cplusplus
          extern "C" {
          #endif
          static inline void* DobbySymbolResolver(const char* image_name, const char* symbol_name) {
              void* handle = dlopen(image_name, RTLD_LAZY);
              if (!handle) return nullptr;
              return dlsym(handle, symbol_name);
          }
          #ifdef __cplusplus
          }
          #endif
          EOF
            echo "Fallback dobby.h verified."
          fi

      # 4. توليد مفاتيح التشفير RSA-2048
      - name: Generate Cryptographic Keys
        run: |
          mkdir -p keys_output
          python3 -c "
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization

          priv = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          with open('keys_output/private_key.pem', 'wb') as f:
              f.write(priv.private_bytes(
                  encoding=serialization.Encoding.PEM,
                  format=serialization.PrivateFormat.PKCS8,
                  encryption_algorithm=serialization.NoEncryption()
              ))

          pub = priv.public_key()
          pub_pem = pub.public_bytes(
              encoding=serialization.Encoding.PEM,
              format=serialization.PublicFormat.SubjectPublicKeyInfo
          )
          with open('keys_output/public_key.pem', 'wb') as f:
              f.write(pub_pem)

          clean_pub = ''.join([l for l in pub_pem.decode('utf-8').splitlines() if not l.startswith('-----')])
          with open('keys_output/public_key_clean.txt', 'w') as f:
              f.write(clean_pub)
          "
          echo "PUB_KEY=$(cat keys_output/public_key_clean.txt)" >> $GITHUB_ENV

      # 5. حقن LicenseManager.java والتأكد من حذف أي ملفات قديمة
      - name: Inject LicenseManager (Java)
        run: |
          python3 -c "
          import os

          pub_key = os.environ.get('PUB_KEY', '')
          target_dir = 'app/src/main/java/io/github/zensu357/camswap'
          pkg = 'io.github.zensu357.camswap'

          if not os.path.exists(target_dir):
              for root, dirs, files in os.walk('app/src/main/java'):
                  if files:
                      target_dir = root
                      pkg = root.replace('app/src/main/java/', '').replace('/', '.')
                      break

          os.makedirs(target_dir, exist_ok=True)
          old_kt = os.path.join(target_dir, 'LicenseManager.kt')
          if os.path.exists(old_kt):
              os.remove(old_kt)

          java_code = f'''package {pkg};

          import android.content.Context;
          import android.os.Build;
          import android.provider.Settings;
          import android.util.Base64;
          import org.json.JSONObject;
          import java.security.KeyFactory;
          import java.security.MessageDigest;
          import java.security.PublicKey;
          import java.security.Signature;
          import java.security.spec.X509EncodedKeySpec;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.TimeZone;

          public class LicenseManager {{
              public static final String PUBLIC_KEY_BASE64 = \"{pub_key}\";

              public static class LicenseInfo {{
                  public boolean isValid;
                  public String owner = \"\";
                  public String hwid = \"\";
                  public String expiresAt = \"\";
                  public String tier = \"\";
                  public String errorMessage = null;

                  public LicenseInfo(boolean isValid) {{
                      this.isValid = isValid;
                  }}

                  public LicenseInfo(boolean isValid, String errorMessage) {{
                      this.isValid = isValid;
                      this.errorMessage = errorMessage;
                  }}

                  public LicenseInfo(boolean isValid, String owner, String hwid, String expiresAt, String tier) {{
                      this.isValid = isValid;
                      this.owner = owner;
                      this.hwid = hwid;
                      this.expiresAt = expiresAt;
                      this.tier = tier;
                  }}
              }}

              public static String getDeviceHWID(Context context) {{
                  try {{
                      String androidId = Settings.Secure.getString(context.getContentResolver(), Settings.Secure.ANDROID_ID);
                      if (androidId == null) androidId = \"\";
                      String raw = androidId + Build.BOARD + Build.BRAND + Build.DEVICE + Build.HARDWARE + Build.MANUFACTURER + Build.MODEL;
                      MessageDigest digest = MessageDigest.getInstance(\"SHA-256\");
                      byte[] hash = digest.digest(raw.getBytes(\"UTF-8\"));
                      StringBuilder hexString = new StringBuilder();
                      for (byte b : hash) {{
                          String hex = Integer.toHexString(0xff & b);
                          if (hex.length() == 1) hexString.append('0');
                          hexString.append(hex);
                      }}
                      return hexString.substring(0, 16).toUpperCase(Locale.US);
                  }} catch (Exception e) {{
                      return \"UNKNOWN_HWID\";
                  }}
              }}

              public static LicenseInfo verifyLicense(Context context, String licenseKey) {{
                  if (licenseKey == null || licenseKey.trim().isEmpty()) {{
                      return new LicenseInfo(false, \"المفتاح فارغ\");
                  }}
                  String[] parts = licenseKey.trim().split(\"\\\\.\");
                  if (parts.length != 2) {{
                      return new LicenseInfo(false, \"تنسيق المفتاح غير صالح\");
                  }}
                  try {{
                      byte[] payloadBytes = Base64.decode(parts[0], Base64.DEFAULT);
                      byte[] sigBytes = Base64.decode(parts, Base64.DEFAULT);

                      byte[] keyBytes = Base64.decode(PUBLIC_KEY_BASE64, Base64.DEFAULT);
                      X509EncodedKeySpec keySpec = new X509EncodedKeySpec(keyBytes);
                      KeyFactory keyFactory = KeyFactory.getInstance(\"RSA\");
                      PublicKey pubKey = keyFactory.generatePublic(keySpec);

                      Signature sig = Signature.getInstance(\"SHA256withRSA\");
                      sig.initVerify(pubKey);
                      sig.update(payloadBytes);

                      if (!sig.verify(sigBytes)) {{
                          return new LicenseInfo(false, \"التوقيع الرقمي غير صالح\");
                      }}

                      JSONObject json = new JSONObject(new String(payloadBytes, \"UTF-8\"));
                      String licHwid = json.optString(\"hwid\", \"\");
                      String owner = json.optString(\"owner\", \"User\");
                      String exp = json.optString(\"expires_at\", \"\");
                      String tier = json.optString(\"tier\", \"VIP\");

                      if (!licHwid.equalsIgnoreCase(getDeviceHWID(context))) {{
                          return new LicenseInfo(false, \"المفتاح غير مخصص لهذا الجهاز\");
                      }}

                      if (!\"LIFETIME\".equalsIgnoreCase(exp)) {{
                          SimpleDateFormat sdf = new SimpleDateFormat(\"yyyy-MM-dd\", Locale.US);
                          sdf.setTimeZone(TimeZone.getTimeZone(\"UTC\"));
                          Date expDate = sdf.parse(exp);
                          if (expDate != null && new Date().after(expDate)) {{
                              return new LicenseInfo(false, \"انتهت صلاحية الترخيص\");
                          }}
                      }}
                      return new LicenseInfo(true, owner, licHwid, exp, tier);
                  }} catch (Exception e) {{
                      return new LicenseInfo(false, e.getMessage());
                  }}
              }}
          }}
          '''
          with open(os.path.join(target_dir, 'LicenseManager.java'), 'w') as f:
              f.write(java_code)
          print('LicenseManager.java injected cleanly.')
          "

      # 6. قواعد ProGuard وتجاهل تحذيرات Xposed
      - name: Configure ProGuard Rules
        run: |
          mkdir -p app
          cat << 'EOF' >> app/proguard-rules.pro
          -dontwarn de.robv.android.xposed.**
          -dontwarn io.github.zensu357.**
          -dontwarn **
          -keepclasseswithmembernames class * {
              native <methods>;
          }
          EOF

      # 7. توليد شهادة التوقيع الرقمي (Keystore)
      - name: Create Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias release_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "pass123456" \
            -keypass "pass123456" \
            -dname "CN=AndroidApp, O=Security, C=US"

      # 8. تشغيل البناء المباشر
      - name: Build Protected Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x lintVitalRelease -x test --stacktrace --no-daemon

      # 9. توقيع الـ APK ومحاذاته
      - name: Sign & Align Final APK
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)
          RAW_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)

          if [ -z "$RAW_APK" ]; then
            echo "Error: No APK was generated by gradle!"
            exit 1
          fi

          mkdir -p final_output
          $ZIPALIGN -v -p 4 "$RAW_APK" final_output/app-aligned.apk || cp "$RAW_APK" final_output/app-aligned.apk
          $APKSIGNER sign --ks release.keystore --ks-pass pass:pass123456 --key-pass pass:pass123456 --out final_output/app-release-protected.apk final_output/app-aligned.apk

      # 10. رفع ملف الـ APK النهائي الجاهز للتثبيت
      - name: Upload Final Protected APK
        uses: actions/upload-artifact@v4
        with:
          name: Protected-Release-APK
          path: final_output/app-release-protected.apk

      # 11. رفع المفتاح الخاص السري للمطور لتوليد التراخيص
      - name: Upload Developer Private Key
        uses: actions/upload-artifact@v4
        with:
          name: Developer-Private-Key-DO-NOT-SHARE
          path: keys_output/private_key.pem
