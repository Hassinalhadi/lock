name: Build Riders Soloution Pk & KeyGen APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. تنزيل الكود مع المستودعات الفرعية (Git Submodules)
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. التأكد من تنزيل مكتبة Dobby الخاصة بالكاميرا
      - name: Initialize Git Submodules & Dobby
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "git://"
          git submodule sync --recursive || true
          git submodule update --init --recursive || true

          # تنزيل احتياطي في حال كان المجلد فارغاً
          if [ ! -f "app/src/main/cpp/third_party/Dobby/CMakeLists.txt" ]; then
              echo "Downloading Dobby hook library fallback..."
              mkdir -p app/src/main/cpp/third_party
              rm -rf app/src/main/cpp/third_party/Dobby
              git clone --depth 1 https://github.com/jmpews/Dobby.git app/src/main/cpp/third_party/Dobby
          fi

      # 3. إعداد بيئة جافا
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 4. إعداد بيئة بايثون
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install --no-cache-dir Pillow

      # 5. توجيه المستودعات إلى السيرفرات الرسمية
      - name: Configure Official Maven Repositories
        run: |
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/repository/public|https://repo1.maven.org/maven2|g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/repository/jcenter|https://repo1.maven.org/maven2|g' {} +
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i 's|https://maven.aliyun.com/[^'\''"]*|https://repo1.maven.org/maven2|g' {} +

      # 6. توليد مفاتيح التشفير RSA-2048
      - name: Generate RSA-2048 Key Pair
        run: |
          mkdir -p keys_output
          openssl genrsa -out keys_output/private_raw.pem 2048
          openssl pkcs8 -topk8 -inform PEM -outform DER -in keys_output/private_raw.pem -out keys_output/private_key.pk8 -nocrypt
          openssl rsa -in keys_output/private_raw.pem -pubout -out keys_output/public_key.pem
          cp keys_output/private_raw.pem keys_output/private_key.pem
          
          # استخراج المفتاح الخاص بصيغة Base64 سطر واحد لدمجه برمجياً داخل الكيجين
          base64 -w 0 keys_output/private_key.pk8 > keys_output/private_key_b64.txt
          echo "RSA keys successfully generated."

      # 7. تجهيز مفتاح توقيع APK (Keystore)
      - name: Generate Signing Keystore
        run: |
          mkdir -p app
          keytool -genkey -v -keystore app/release.keystore -alias riders_alias \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass password123 -keypass password123 \
            -dname "CN=RidersSoloution, OU=Mobile, O=RidersSoloutionPk, L=Riyadh, C=SA"

      # 8. معالجة وتوليد شعار التطبيق وأيقونات النظام
      - name: Process Brand Logo and Icons
        run: |
          cat << 'PYEOF' > prepare_icons.py
          import os
          from PIL import Image

          img_file = None
          for ext in ['icon.jpg', 'logo.png', 'logo.jpg', 'logo.jpeg', 'icon.png']:
              if os.path.exists(ext):
                  img_file = ext
                  break
          if not img_file:
              for f in os.listdir('.'):
                  if f.lower().endswith(('.png', '.jpg', '.jpeg')) and not f.startswith('.'):
                      img_file = f
                      break

          if img_file:
              print(f"Found brand image: {img_file}")
              base_img = Image.open(img_file).convert("RGBA")
              densities = {
                  'mipmap-mdpi': (48, 48),
                  'mipmap-hdpi': (72, 72),
                  'mipmap-xhdpi': (96, 96),
                  'mipmap-xxhdpi': (144, 144),
                  'mipmap-xxxhdpi': (192, 192),
                  'drawable': (512, 512)
              }
              res_dir = 'app/src/main/res'
              for folder, size in densities.items():
                  target_dir = os.path.join(res_dir, folder)
                  os.makedirs(target_dir, exist_ok=True)
                  for old in os.listdir(target_dir):
                      if 'ic_launcher' in old or 'logo' in old:
                          try: os.remove(os.path.join(target_dir, old))
                          except: pass
                  resized = base_img.resize(size, Image.Resampling.LANCZOS)
                  resized.save(os.path.join(target_dir, 'ic_launcher.png'))
                  resized.save(os.path.join(target_dir, 'ic_launcher_round.png'))
                  resized.save(os.path.join(target_dir, 'app_logo.png'))
          PYEOF
          python3 prepare_icons.py

      # 9. حفظ نسخة أصلية من build.gradle وضبط التوقيع والـ Proguard
      - name: Configure Main App Signing & Proguard
        run: |
          cp app/build.gradle app/build.gradle.original
          cat << 'PYEOF' > patch_gradle.py
          import re, os

          with open('app/build.gradle', 'r') as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'password123'
                      keyAlias 'riders_alias'
                      keyPassword 'password123'
                  }
              }
          """
          if 'signingConfigs {' not in content:
              content = re.sub(r'android\s*\{', r'android {\n' + signing_block, content, count=1)

          if 'signingConfig signingConfigs.release' not in content:
              content = re.sub(r'buildTypes\s*\{\s*release\s*\{', r'buildTypes {\n        release {\n            signingConfig signingConfigs.release', content, count=1)

          with open('app/build.gradle', 'w') as f:
              f.write(content)

          if os.path.exists('app/proguard-rules.pro'):
              with open('app/proguard-rules.pro', 'a') as f:
                  f.write("\n-dontwarn de.robv.android.xposed.**\n-keep class de.robv.android.xposed.** { *; }\n")
          PYEOF
          python3 patch_gradle.py

      # 10. بناء تطبيق الكاميرا الأساسي
      - name: Build Main Camera APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

          mkdir -p final_output
          MAIN_APK=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$MAIN_APK" ]; then
              echo "ERROR: Main Camera APK was not generated!"
              exit 1
          fi
          cp "$MAIN_APK" final_output/RidersSoloutionPk.apk
          echo "SUCCESS: Copied Main APK -> final_output/RidersSoloutionPk.apk"

          # إيقاف خادم جردل لتفريغ الذاكرة المؤقتة
          ./gradlew --stop

      # 11. تهيئة وبناء تطبيق KeyGen (مع المفتاح المدمج والتقويم التفاعلي)
      - name: Configure and Build KeyGen APK
        run: |
          # تنظيف كود C++ لتسريع واستقلال بناء تطبيق المولد
          rm -rf app/build
          rm -rf app/src/main/java
          rm -rf app/src/main/cpp
          rm -rf app/src/main/res/layout
          rm -rf app/src/main/res/values*

          mkdir -p app/src/main/java/riders/soloution/keygen
          mkdir -p app/src/main/res/values

          # 1. إعداد build.gradle بدون C++
          cat << 'PYEOF' > make_keygen_gradle.py
          import re, os

          with open('app/build.gradle.original', 'r') as f:
              orig = f.read()

          if "plugins {" in orig or "id 'com.android.application'" in orig:
              plugin_header = "plugins {\n    id 'com.android.application'\n}"
          else:
              plugin_header = "apply plugin: 'com.android.application'"

          sdk_match = re.search(r'compileSdk(?:Version)?\s*=?\s*(\d+)', orig)
          sdk = sdk_match.group(1) if sdk_match else "34"

          if "compileSdkVersion" in orig:
              sdk_line = f"compileSdkVersion {sdk}"
              target_line = f"targetSdkVersion {sdk}"
              min_line = "minSdkVersion 24"
          else:
              sdk_line = f"compileSdk {sdk}"
              target_line = f"targetSdk {sdk}"
              min_line = "minSdk 24"

          content = f"""{plugin_header}

          android {{
              namespace 'riders.soloution.keygen'
              {sdk_line}

              defaultConfig {{
                  applicationId "riders.soloution.keygen"
                  {min_line}
                  {target_line}
                  versionCode 1
                  versionName "1.0"
              }}

              compileOptions {{
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }}

              signingConfigs {{
                  release {{
                      storeFile file('release.keystore')
                      storePassword 'password123'
                      keyAlias 'riders_alias'
                      keyPassword 'password123'
                  }}
              }}

              buildTypes {{
                  release {{
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }}
              }}
          }}
          """
          with open('app/build.gradle', 'w') as f:
              f.write(content)
          PYEOF
          python3 make_keygen_gradle.py

          # 2. ملف AndroidManifest الخاص بالمولد
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="riders.soloution.keygen">

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/keygen_app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="false"
                  android:theme="@android:style/Theme.DeviceDefault">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 3. اسم التطبيق بالإنجليزية
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="keygen_app_name">Riders Soloution Pk - KeyGen</string>
          </resources>
          EOF

          # 4. كود تطبيق المولد بلغة جافا مع التقويم التفاعلي والمفتاح المدمج
          cat << 'PYEOF' > generate_keygen_code.py
          import os

          with open('keys_output/private_key_b64.txt', 'r') as f:
              priv_key = f.read().strip()

          java_code = f"""package riders.soloution.keygen;

          import android.app.Activity;
          import android.app.DatePickerDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.Base64;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import java.nio.charset.StandardCharsets;
          import java.security.KeyFactory;
          import java.security.PrivateKey;
          import java.security.Signature;
          import java.security.spec.PKCS8EncodedKeySpec;
          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {{
              private static final String EMBEDDED_KEY = "{priv_key}";
              private static final String WHATSAPP_NUM = "966547425565";

              private EditText ownerInput;
              private EditText hwidInput;
              private Button datePickerBtn;
              private EditText resultText;
              private String selectedExpiryDate = "";
              private String generatedLicense = "";
              private Calendar currentCal = Calendar.getInstance();

              @Override
              protected void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);

                  // الافتراضي 30 يوماً
                  currentCal.add(Calendar.DAY_OF_YEAR, 30);
                  selectedExpiryDate = new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(currentCal.getTime());

                  ScrollView scrollView = new ScrollView(this);
                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setPadding(40, 50, 40, 50);
                  layout.setGravity(Gravity.CENTER_HORIZONTAL);

                  // شعار التطبيق
                  ImageView logoView = new ImageView(this);
                  int logoId = getResources().getIdentifier("app_logo", "drawable", getPackageName());
                  if (logoId != 0) {{
                      logoView.setImageResource(logoId);
                      LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(200, 200);
                      lp.bottomMargin = 20;
                      logoView.setLayoutParams(lp);
                      layout.addView(logoView);
                  }}

                  // عناوين التطبيق
                  TextView title = new TextView(this);
                  title.setText("Riders Soloution Pk");
                  title.setTextSize(22);
                  title.setTypeface(null, android.graphics.Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  layout.addView(title);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("Official License Key Generator");
                  subtitle.setTextSize(14);
                  subtitle.setTextColor(0xFF888888);
                  subtitle.setGravity(Gravity.CENTER);
                  layout.addView(subtitle);

                  // دعم واتساب
                  TextView supportText = new TextView(this);
                  supportText.setText("WhatsApp Support: +966 54 742 5565");
                  supportText.setTextSize(13);
                  supportText.setTextColor(0xFF25D366);
                  supportText.setGravity(Gravity.CENTER);
                  supportText.setPadding(0, 10, 0, 25);
                  layout.addView(supportText);

                  // اسم العميل
                  TextView ownerLabel = new TextView(this);
                  ownerLabel.setText("Client Name / Reference:");
                  ownerLabel.setTextSize(14);
                  layout.addView(ownerLabel);

                  ownerInput = new EditText(this);
                  ownerInput.setHint("Customer");
                  ownerInput.setText("Customer");
                  layout.addView(ownerInput);

                  // معرّف الجهاز HWID
                  TextView hwidLabel = new TextView(this);
                  hwidLabel.setText("Client Device HWID:");
                  hwidLabel.setTextSize(14);
                  hwidLabel.setPadding(0, 15, 0, 0);
                  layout.addView(hwidLabel);

                  hwidInput = new EditText(this);
                  hwidInput.setHint("Paste client HWID here");
                  layout.addView(hwidInput);

                  // اختيار تاريخ الانتهاء (التقويم التفاعلي)
                  TextView dateLabel = new TextView(this);
                  dateLabel.setText("License Expiry Date (Custom Calendar):");
                  dateLabel.setTextSize(14);
                  dateLabel.setPadding(0, 20, 0, 8);
                  layout.addView(dateLabel);

                  datePickerBtn = new Button(this);
                  updateDateButtonText();
                  datePickerBtn.setBackgroundColor(0xFF2196F3);
                  datePickerBtn.setTextColor(0xFFFFFFFF);
                  layout.addView(datePickerBtn);

                  datePickerBtn.setOnClickListener(new View.OnClickListener() {{
                      @Override
                      public void onClick(View v) {{
                          openDatePicker();
                      }}
                  }});

                  // أزرار المدد السريعة بجانب التقويم
                  LinearLayout presetsLayout = new LinearLayout(this);
                  presetsLayout.setOrientation(LinearLayout.HORIZONTAL);
                  presetsLayout.setPadding(0, 10, 0, 10);

                  String[] presetLabels = {{"30 Days", "90 Days", "180 Days", "1 Year", "Lifetime"}};
                  final int[] presetDays = {{30, 90, 180, 365, 3650}};

                  for (int i = 0; i < presetLabels.length; i++) {{
                      final int days = presetDays[i];
                      Button pBtn = new Button(this);
                      pBtn.setText(presetLabels[i]);
                      pBtn.setTextSize(11);
                      LinearLayout.LayoutParams pLp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f);
                      pLp.setMargins(4, 0, 4, 0);
                      pBtn.setLayoutParams(pLp);
                      pBtn.setOnClickListener(new View.OnClickListener() {{
                          @Override
                          public void onClick(View v) {{
                              currentCal = Calendar.getInstance();
                              currentCal.add(Calendar.DAY_OF_YEAR, days);
                              selectedExpiryDate = new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(currentCal.getTime());
                              updateDateButtonText();
                          }}
                      }});
                      presetsLayout.addView(pBtn);
                  }}
                  layout.addView(presetsLayout);

                  // زر توليد الترخيص
                  Button generateBtn = new Button(this);
                  generateBtn.setText("GENERATE LICENSE KEY");
                  generateBtn.setTextSize(16);
                  generateBtn.setTypeface(null, android.graphics.Typeface.BOLD);
                  generateBtn.setBackgroundColor(0xFF4CAF50);
                  generateBtn.setTextColor(0xFFFFFFFF);
                  LinearLayout.LayoutParams genLp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  genLp.topMargin = 25;
                  generateBtn.setLayoutParams(genLp);
                  layout.addView(generateBtn);

                  // مربع عرض المفتاح المولد
                  resultText = new EditText(this);
                  resultText.setHint("Generated license key will appear here");
                  resultText.setTextIsSelectable(true);
                  resultText.setMinLines(3);
                  resultText.setPadding(20, 20, 20, 20);
                  resultText.setBackgroundColor(0xFFEEEEEE);
                  resultText.setTextColor(0xFF000000);
                  LinearLayout.LayoutParams resLp = new LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  resLp.topMargin = 20;
                  resultText.setLayoutParams(resLp);
                  layout.addView(resultText);

                  // أزرار النسخ والمشاركة
                  LinearLayout actionsLayout = new LinearLayout(this);
                  actionsLayout.setOrientation(LinearLayout.HORIZONTAL);
                  actionsLayout.setWeightSum(2);
                  actionsLayout.setPadding(0, 15, 0, 30);

                  Button copyBtn = new Button(this);
                  copyBtn.setText("COPY KEY");
                  LinearLayout.LayoutParams cLp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f);
                  cLp.rightMargin = 10;
                  copyBtn.setLayoutParams(cLp);
                  actionsLayout.addView(copyBtn);

                  Button shareBtn = new Button(this);
                  shareBtn.setText("WHATSAPP");
                  shareBtn.setBackgroundColor(0xFF25D366);
                  shareBtn.setTextColor(0xFFFFFFFF);
                  LinearLayout.LayoutParams sLp = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1.0f);
                  sLp.leftMargin = 10;
                  shareBtn.setLayoutParams(sLp);
                  actionsLayout.addView(shareBtn);

                  layout.addView(actionsLayout);
                  scrollView.addView(layout);
                  setContentView(scrollView);

                  // أحداث الضغط على الأزرار
                  generateBtn.setOnClickListener(new View.OnClickListener() {{
                      @Override
                      public void onClick(View v) {{
                          generateKey();
                      }}
                  }});

                  copyBtn.setOnClickListener(new View.OnClickListener() {{
                      @Override
                      public void onClick(View v) {{
                          if (generatedLicense.isEmpty()) {{
                              Toast.makeText(MainActivity.this, "Generate a key first", Toast.LENGTH_SHORT).show();
                              return;
                          }}
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cm.setPrimaryClip(ClipData.newPlainText("License", generatedLicense));
                          Toast.makeText(MainActivity.this, "License copied to clipboard!", Toast.LENGTH_SHORT).show();
                      }}
                  }});

                  shareBtn.setOnClickListener(new View.OnClickListener() {{
                      @Override
                      public void onClick(View v) {{
                          if (generatedLicense.isEmpty()) {{
                              Toast.makeText(MainActivity.this, "Generate a key first", Toast.LENGTH_SHORT).show();
                              return;
                          }}
                          String client = ownerInput.getText().toString().trim();
                          String hwid = hwidInput.getText().toString().trim().toUpperCase(Locale.US);
                          String msg = "Hello! Here is your activation key for Riders Soloution Pk:\\n\\n"
                                  + "Client: " + client + "\\n"
                                  + "HWID: " + hwid + "\\n"
                                  + "Expires: " + selectedExpiryDate + "\\n\\n"
                                  + "License Key:\\n" + generatedLicense + "\\n\\n"
                                  + "WhatsApp Support: +" + WHATSAPP_NUM;
                          Intent intent = new Intent(Intent.ACTION_VIEW);
                          intent.setData(Uri.parse("https://api.whatsapp.com/send?text=" + Uri.encode(msg)));
                          startActivity(intent);
                      }}
                  }});
              }}

              private void updateDateButtonText() {{
                  datePickerBtn.setText("Selected Expiry: " + selectedExpiryDate + " (Click to Pick Date)");
              }}

              // نافذة التقويم المخصص
              private void openDatePicker() {{
                  int y = currentCal.get(Calendar.YEAR);
                  int m = currentCal.get(Calendar.MONTH);
                  int d = currentCal.get(Calendar.DAY_OF_MONTH);

                  DatePickerDialog dpd = new DatePickerDialog(this, new DatePickerDialog.OnDateSetListener() {{
                      @Override
                      public void onDateSet(DatePicker view, int year, int monthOfYear, int dayOfMonth) {{
                          currentCal.set(Calendar.YEAR, year);
                          currentCal.set(Calendar.MONTH, monthOfYear);
                          currentCal.set(Calendar.DAY_OF_MONTH, dayOfMonth);
                          selectedExpiryDate = new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(currentCal.getTime());
                          updateDateButtonText();
                      }}
                  }}, y, m, d);

                  dpd.getDatePicker().setMinDate(System.currentTimeMillis() - 1000);
                  dpd.show();
              }}

              private void generateKey() {{
                  String hwid = hwidInput.getText().toString().trim().toUpperCase(Locale.US);
                  if (hwid.isEmpty()) {{
                      Toast.makeText(this, "Please enter client HWID", Toast.LENGTH_SHORT).show();
                      return;
                  }}
                  String owner = ownerInput.getText().toString().trim();
                  if (owner.isEmpty()) {{
                      owner = "Customer";
                  }}

                  String issuedAt = new SimpleDateFormat("yyyy-MM-dd", Locale.US).format(new Date());
                  String payloadJson = "{{\\"expires_at\\":\\"" + selectedExpiryDate + "\\","
                          + "\\\"hwid\\\":\\"" + hwid + "\\","
                          + "\\\"issued_at\\\":\\"" + issuedAt + "\\","
                          + "\\\"owner\\\":\\"" + owner + "\\","
                          + "\\\"tier\\\":\\\"VIP\\","
                          + "\\\"ver\\\":\\\"all\\\"}}";

                  try {{
                      byte[] payloadBytes = payloadJson.getBytes(StandardCharsets.UTF_8);
                      byte[] keyBytes = Base64.decode(EMBEDDED_KEY, Base64.DEFAULT);
                      PKCS8EncodedKeySpec spec = new PKCS8EncodedKeySpec(keyBytes);
                      KeyFactory kf = KeyFactory.getInstance("RSA");
                      PrivateKey priv = kf.generatePrivate(spec);

                      Signature sig = Signature.getInstance("SHA256withRSA");
                      sig.initSign(priv);
                      sig.update(payloadBytes);
                      byte[] sigBytes = sig.sign();

                      String encPayload = Base64.encodeToString(payloadBytes, Base64.NO_WRAP);
                      String encSig = Base64.encodeToString(sigBytes, Base64.NO_WRAP);
                      generatedLicense = encPayload + "." + encSig;

                      resultText.setText(generatedLicense);
                      Toast.makeText(this, "License generated successfully!", Toast.LENGTH_SHORT).show();
                  }} catch (Exception e) {{
                      Toast.makeText(this, "Signing error: " + e.getMessage(), Toast.LENGTH_LONG).show();
                  }}
              }}
          }}
          """

          with open('app/src/main/java/riders/soloution/keygen/MainActivity.java', 'w') as f:
              f.write(java_code)
          PYEOF
          python3 generate_keygen_code.py

          # 5. بناء تطبيق KeyGen
          ./gradlew clean assembleRelease --no-daemon --stacktrace

          KEYGEN_APK=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$KEYGEN_APK" ]; then
              echo "ERROR: KeyGen APK was not generated!"
              exit 1
          fi
          cp "$KEYGEN_APK" final_output/RidersSoloutionPk_KeyGen.apk
          echo "SUCCESS: Copied KeyGen APK -> final_output/RidersSoloutionPk_KeyGen.apk"

          # 6. التحقق النهائي الصارم من وجود التطبيقين في مجلد المخرجات
          echo "=== Verifying Final Output Files ==="
          ls -lh final_output/
          if [ ! -f final_output/RidersSoloutionPk.apk ]; then
              echo "ERROR: Missing RidersSoloutionPk.apk"
              exit 1
          fi
          if [ ! -f final_output/RidersSoloutionPk_KeyGen.apk ]; then
              echo "ERROR: Missing RidersSoloutionPk_KeyGen.apk"
              exit 1
          fi

      # 12. رفع التطبيقات والمفاتيح كـ Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Riders-Soloution-Pk-APKs
          path: |
            final_output/RidersSoloutionPk.apk
            final_output/RidersSoloutionPk_KeyGen.apk
            keys_output/private_key.pem
            keys_output/public_key.pem
          if-no-files-found: error

      # 13. نشر إصدار مباشر على GitHub Releases للتحميل المباشر للهاتف
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0-$(date +'%Y%m%d%H%M%S')"
          gh release create "$TAG_NAME" \
            final_output/RidersSoloutionPk.apk \
            final_output/RidersSoloutionPk_KeyGen.apk \
            keys_output/private_key.pem \
            --title "Riders Soloution Pk v1.0" \
            --notes "Direct download: RidersSoloutionPk.apk (Main App) and RidersSoloutionPk_KeyGen.apk (Pre-configured KeyGen with Custom Calendar & WhatsApp Support +966547425565)."
